<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Runner — Jeu de Saut</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#87ceeb;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{display:block;background:linear-gradient(180deg,#87ceeb 0%,#e0f6ff 100%);border:3px solid #333;box-shadow:0 10px 30px rgba(0,0,0,0.3)}
#ui{position:fixed;top:20px;left:20px;font-size:24px;font-weight:bold;color:#333;z-index:10}
#score{position:fixed;top:20px;right:20px;font-size:28px;font-weight:bold;color:#ff6b6b}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.8);z-index:20;pointer-events:auto}
.dialog{text-align:center;background:#fff;border-radius:15px;padding:40px;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.dialog h1{font-size:48px;color:#ff6b6b;margin:15px 0}
.dialog p{font-size:16px;color:#333;margin:15px 0;line-height:1.6}
button{background:#4ecdc4;border:none;color:#fff;padding:15px 40px;font-size:18px;font-weight:bold;border-radius:8px;cursor:pointer;margin:10px 0;transition:.2s}
button:hover{background:#45b7b0;transform:scale(1.05)}
.hidden{display:none!important}
#gameOverScore{font-size:28px;color:#ff6b6b;font-weight:bold}
</style>
</head>
<body>
<canvas id="game" width="800" height="400"></canvas>
<div id="ui">Score: <span id="pts">0</span></div>
<div id="menu" class="dialog">
 <h1>🏃 PIXEL RUNNER</h1>
 <p>Saute pour éviter les obstacles!</p>
 <p style="font-size:14px;opacity:.7">Clique ou appuie sur ESPACE pour sauter<br>Plus tu avances, plus c'est rapide!</p>
 <button onclick="startGame()">JOUER</button>
 <p style="font-size:12px;opacity:.5;margin-top:20px">© 2024 - Jeu simple et fun</p>
</div>

<script>
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// États
const STATE = {
  MENU: 'menu',
  PLAYING: 'playing',
  GAMEOVER: 'gameover'
};

// Couleurs
const COLORS = {
  player: '#ff6b6b',
  obstacle: '#333',
  ground: '#90ee90',
  sky: '#87ceeb',
  text: '#333'
};

// Physique
const GRAVITY = 0.6;
const JUMP_STRENGTH = 15;
const GROUND_Y = 300;

class Player {
  constructor() {
    this.x = 100;
    this.y = GROUND_Y;
    this.w = 30;
    this.h = 40;
    this.vx = 0;
    this.vy = 0;
    this.jumping = false;
  }

  jump() {
    if (!this.jumping && this.y >= GROUND_Y - 5) {
      this.vy = -JUMP_STRENGTH;
      this.jumping = true;
      sfx('jump');
    }
  }

  update() {
    // Appliquer gravité
    this.vy += GRAVITY;
    this.y += this.vy;

    // Collision sol
    if (this.y >= GROUND_Y) {
      this.y = GROUND_Y;
      this.vy = 0;
      this.jumping = false;
    }
  }

  draw(ctx) {
    // Corps
    ctx.fillStyle = COLORS.player;
    ctx.fillRect(this.x, this.y, this.w, this.h);
    
    // Yeux
    ctx.fillStyle = '#fff';
    ctx.fillRect(this.x + 8, this.y + 10, 6, 6);
    ctx.fillRect(this.x + 16, this.y + 10, 6, 6);
    ctx.fillStyle = '#000';
    ctx.fillRect(this.x + 9, this.y + 11, 4, 4);
    ctx.fillRect(this.x + 17, this.y + 11, 4, 4);
    
    // Bouche
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(this.x + 15, this.y + 28, 3, 0, Math.PI);
    ctx.stroke();
  }

  collidesWith(obstacle) {
    return this.x < obstacle.x + obstacle.w &&
           this.x + this.w > obstacle.x &&
           this.y < obstacle.y + obstacle.h &&
           this.y + this.h > obstacle.y;
  }
}

class Obstacle {
  constructor(speed) {
    this.x = canvas.width;
    this.y = GROUND_Y;
    this.w = 25;
    this.h = 45;
    this.speed = speed;
  }

  update() {
    this.x -= this.speed;
  }

  draw(ctx) {
    ctx.fillStyle = COLORS.obstacle;
    ctx.fillRect(this.x, this.y, this.w, this.h);
    
    // Détail
    ctx.fillStyle = '#666';
    ctx.fillRect(this.x + 5, this.y + 10, 5, 10);
    ctx.fillRect(this.x + 15, this.y + 10, 5, 10);
    ctx.fillRect(this.x + 5, this.y + 25, 5, 10);
    ctx.fillRect(this.x + 15, this.y + 25, 5, 10);
  }

  isOffScreen() {
    return this.x + this.w < 0;
  }
}

// Variables du jeu
let state = STATE.MENU;
let player = null;
let obstacles = [];
let score = 0;
let gameSpeed = 5;
let spawnRate = 0.02;
let gameTime = 0;

function startGame() {
  state = STATE.PLAYING;
  player = new Player();
  obstacles = [];
  score = 0;
  gameSpeed = 5;
  spawnRate = 0.02;
  gameTime = 0;
  document.getElementById('menu').classList.add('hidden');
}

function endGame() {
  state = STATE.GAMEOVER;
  const menu = document.getElementById('menu');
  menu.innerHTML = `
    <div class="dialog">
      <h1>GAME OVER</h1>
      <p>Ton score: <span id="gameOverScore">${score}</span></p>
      <p>Tu as parcouru <b>${Math.floor(gameTime / 60)}m</b></p>
      <button onclick="location.reload()">Rejouer</button>
    </div>
  `;
  menu.classList.remove('hidden');
}

function update() {
  if (state !== STATE.PLAYING) return;

  gameTime += gameSpeed / 5;
  
  // Augmenter difficulté
  gameSpeed = 5 + (score / 100) * 3; // Max ~8
  spawnRate = 0.02 + (score / 500) * 0.03; // Max ~0.08

  // Joueur
  player.update();

  // Spawn obstacles
  if (Math.random() < spawnRate) {
    obstacles.push(new Obstacle(gameSpeed));
  }

  // Update obstacles
  for (let i = obstacles.length - 1; i >= 0; i--) {
    obstacles[i].update();

    // Collision
    if (player.collidesWith(obstacles[i])) {
      endGame();
      return;
    }

    // Obstacle passé = +1 point
    if (obstacles[i].x + obstacles[i].w < player.x && !obstacles[i].passed) {
      obstacles[i].passed = true;
      score++;
      sfx('point');
    }

    // Supprimer obstacle
    if (obstacles[i].isOffScreen()) {
      obstacles.splice(i, 1);
    }
  }

  document.getElementById('pts').textContent = score;
}

function draw() {
  // Ciel dégradé
  const grad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  grad.addColorStop(0, '#87ceeb');
  grad.addColorStop(1, '#e0f6ff');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, GROUND_Y);

  // Sol
  ctx.fillStyle = '#90ee90';
  ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);

  // Herbe
  ctx.fillStyle = '#7cc96f';
  ctx.fillRect(0, GROUND_Y, canvas.width, 3);

  // Nuages
  ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
  drawCloud(100 + (gameTime * 0.5 % 800), 50, 40);
  drawCloud(400 + (gameTime * 0.3 % 800), 100, 50);
  drawCloud(600 + (gameTime * 0.4 % 800), 80, 35);

  if (state === STATE.PLAYING) {
    // Joueur
    player.draw(ctx);

    // Obstacles
    for (const obs of obstacles) {
      obs.draw(ctx);
    }

    // Distance
    const distance = Math.floor(gameTime / 10);
    ctx.fillStyle = '#333';
    ctx.font = 'bold 16px Arial';
    ctx.textAlign = 'left';
    ctx.fillText(`Distance: ${distance}m`, 20, 40);
  }
}

function drawCloud(x, y, size) {
  ctx.beginPath();
  ctx.arc(x, y, size, 0, Math.PI * 2);
  ctx.arc(x + size * 0.7, y - size * 0.3, size * 0.8, 0, Math.PI * 2);
  ctx.arc(x + size * 1.3, y, size * 0.7, 0, Math.PI * 2);
  ctx.fill();
}

// Son simple
function sfx(type) {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const gain = ac.createGain();
    const osc = ac.createOscillator();
    osc.connect(gain);
    gain.connect(ac.destination);
    
    if (type === 'jump') {
      osc.frequency.setValueAtTime(400, ac.currentTime);
      osc.frequency.setValueAtTime(200, ac.currentTime + 0.1);
      gain.gain.setValueAtTime(0.3, ac.currentTime);
      gain.gain.setValueAtTime(0, ac.currentTime + 0.1);
      osc.start(ac.currentTime);
      osc.stop(ac.currentTime + 0.1);
    } else if (type === 'point') {
      osc.frequency.setValueAtTime(800, ac.currentTime);
      osc.frequency.setValueAtTime(1000, ac.currentTime + 0.1);
      gain.gain.setValueAtTime(0.2, ac.currentTime);
      gain.gain.setValueAtTime(0, ac.currentTime + 0.1);
      osc.start(ac.currentTime);
      osc.stop(ac.currentTime + 0.1);
    }
  } catch (e) {}
}

// Contrôles
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && state === STATE.PLAYING) {
    player.jump();
    e.preventDefault();
  }
});

document.addEventListener('click', () => {
  if (state === STATE.PLAYING && player) {
    player.jump();
  }
});

document.addEventListener('touchstart', () => {
  if (state === STATE.PLAYING && player) {
    player.jump();
  }
});

// Boucle de jeu
function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
